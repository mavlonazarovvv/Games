<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Игровой клуб</title><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>

header{display:flex;align-items:center;gap:12px;padding:14px 0;position:sticky;top:0;z-index:5;backdrop-filter:blur(14px)}

button:active{transform:scale(.96)}button.s{background:#ffffff1a}button.g{background:linear-gradient(135deg,#2ee59d,#0fa3b1);color:#042}button.r{background:var(--r)}
input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid #ffffff1f;background:#ffffff0d;color:var(--t);font:inherit;margin:5px 0;outline:0}

.b4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:#ffffff0d;padding:7px;border-radius:16px;touch-action:none}
.t{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#ffffff10;font-weight:800;font-size:22px}

table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;text-align:left;font-size:14px;border-bottom:1px solid #ffffff12}
canvas{width:100%;max-width:340px;display:block;margin:auto;background:#ffffff0a;border-radius:16px}
.bb{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;background:#ffffff0a;padding:6px;border-radius:14px}
.bb div{aspect-ratio:1;border-radius:6px;background:#ffffff0f}.bb .f,.pp i.f{background:linear-gradient(135deg,var(--a),var(--a2))}
.pcs{display:flex;justify-content:space-around;margin-top:12px;min-height:70px;align-items:center}
.pp{display:grid;gap:2px;padding:8px;border-radius:12px;border:2px solid transparent}.pp.sel{border-color:#ffd166;background:#ffffff14}.pp i{width:14px;height:14px;border-radius:4px}

.ck div{aspect-ratio:1;display:flex;align-items:center;justify-content:center}.lt{background:#4a517a}.dk{background:#232845}.sl{outline:3px solid #ffd166;outline-offset:-3px}.tg{background:#2ee59d66!important}
.pc{width:78%;height:78%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:#ffd166;box-shadow:0 3px 6px #0008}
.pc.w{background:radial-gradient(circle at 30% 30%,#fff,#aab)}.pc.b{background:radial-gradient(circle at 30% 30%,#666,#111)}
.dp{display:grid;grid-template-columns:repeat(3,76px);gap:8px;justify-content:center;margin-top:14px}.dp button{height:62px;font-size:26px;padding:0}
canvas,.pp{touch-action:none}.card{animation:in .3s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
header{background:linear-gradient(#0b0d17cc,transparent);margin:0 -14px;padding-left:14px;padding-right:14px}
.cd{background:#fff;color:#111;padding:9px 5px;min-width:44px;font-weight:800;border-radius:9px;margin:2px;font-size:15px}.cd.rd{color:#e5484d}.tbl{display:flex;flex-wrap:wrap;gap:8px;min-height:80px;padding:10px;background:#ffffff0a;border-radius:14px;margin:8px 0}.pr{display:flex;flex-direction:column}.pr .cd+.cd{margin-top:-20px;margin-left:14px;box-shadow:0 0 0 2px #7c6cff}.hand{display:flex;flex-wrap:wrap;margin-top:10px}.sel2{outline:2px solid #ffd166;border-radius:10px}
.pk{width:62px;height:90px;background:#fff;border-radius:9px;position:relative;color:#16171d;box-shadow:0 3px 8px #0007;flex:none;font-weight:800;cursor:pointer;user-select:none}.pk.rd{color:#d62839}
.pk .rn{position:absolute;left:5px;top:4px;font-size:14px;line-height:1.05;text-align:center}.pk .r2{left:auto;top:auto;right:5px;bottom:4px;transform:rotate(180deg)}.pk .ct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px}
.dfs{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:radial-gradient(ellipse at center,#1d7a4d,#0a2f1f 75%);padding-top:env(safe-area-inset-top,0px)}
.dtop{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:#fff;font-weight:700}.dtop button{padding:6px 14px}
.opp{display:flex;gap:8px;overflow-x:auto;padding:0 12px}.op{flex:none;background:#00000055;border-radius:14px;padding:6px 12px;text-align:center;color:#fff;border:2px solid transparent;display:flex;flex-direction:column;align-items:center}.op.at{border-color:#ffd166}.op.df{border-color:#6cc4ff}
.av2{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--a2));display:flex;align-items:center;justify-content:center;font-weight:800}
.felt{flex:1;margin:10px 12px;border-radius:60px;border:7px solid #5b3a1e;background:radial-gradient(ellipse,#2fa468,#14613b);box-shadow:inset 0 0 40px #000a,0 6px 20px #0008;display:flex;align-items:center;justify-content:center;overflow:auto}
.tbl2{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:14px}.pr{position:relative;width:62px;height:90px;flex:none}.pr .pk+.pk{position:absolute;left:16px;top:20px;box-shadow:0 0 0 2px #7c6cff,0 3px 8px #0007}.sel2 .pk{outline:3px solid #ffd166}
.st{text-align:center;color:#fff;font-weight:700;margin:0 12px;min-height:22px}.acts{display:flex;gap:8px;justify-content:center;padding:8px;min-height:60px}
.hand2{display:flex;gap:8px;overflow-x:auto;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));background:#0006}.hand2 .pk{width:66px;height:96px}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:32px;margin:12px 0 4px;background:linear-gradient(135deg,#fff,#b9a8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{text-align:center;padding:48px 0 6px}.logo{width:88px;height:88px;margin:auto;border-radius:28px;background:linear-gradient(135deg,var(--a),var(--a2));display:flex;align-items:center;justify-content:center;font-size:46px;box-shadow:0 14px 44px #7c6cff88}
.gc{position:relative;overflow:hidden;box-shadow:0 10px 30px #0007,inset 0 1px 0 #ffffff55}.gc::after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;background:#ffffff22;right:-34px;top:-44px}.gc b{filter:drop-shadow(0 4px 6px #0006)}
nav button{position:relative;transition:.2s}nav button.on{background:linear-gradient(180deg,#7c6cff55,#ff6cc333)}
.bdg{position:absolute;top:0;right:16%;background:var(--r);color:#fff;font-size:10px;font-style:normal;border-radius:99px;padding:1px 6px}.bdg:empty{display:none}
.card{box-shadow:0 6px 22px #0004}.bal{box-shadow:0 0 18px #2ee59d44}
button.g,button.r{box-shadow:0 4px 14px #0004}button:disabled{opacity:.4}

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const CFG={apiKey:"AIzaSyD8WpXPYwLhywGX1GcW4xPhA7nfR_Rh6xY",authDomain:"games-club-70b7c.firebaseapp.com",projectId:"games-club-70b7c",storageBucket:"games-club-70b7c.firebasestorage.app",messagingSenderId:"789798637529",appId:"1:789798637529:web:ac36695a545ad208b9d3c8"};
var pend=0;const ADM='mavlonazarov',AH='70f279317a2d1a840e38d8d33367f2191a0ded72672d3f82226f0ac57b81d6c5';
const $=s=>document.querySelector(s),A=$('#app');
let db,me=null,U=null,tab='games',stop=null,unU=null,note='';
const H=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const ud=l=>db.doc('users/'+l);
const addBal=n=>ud(me).update({bal:U.bal+n});
const LS={g:()=>{try{return JSON.parse(localStorage.getItem('gc')||'null')}catch(e){return null}},s:v=>{try{localStorage.setItem('gc',JSON.stringify(v))}catch(e){}}};
function cleanup(){if(stop){stop();stop=null}}
async function init(){
 A.innerHTML='<p class="m">Подключение…</p>';
 try{firebase.initializeApp(CFG);db=firebase.firestore()}catch(e){console.error(e)}
 if(!db){A.innerHTML='<div class="card">Не удалось подключиться к базе данных. Проверь интернет.</div>';return}
 const s=LS.g();if(s)await login(s.l,s.p,true);else authView()}
function authView(msg){cleanup();A.innerHTML=`<div class="hero"><div class="logo">🎮</div><h1>Игровой клуб</h1><p class="m">Играй с друзьями и делай ставки</p></div><div class="card"><p class="m">Новым игрокам 500 монет после подтверждения админом</p>
<input id="l" placeholder="Логин (латиница/цифры)" autocapitalize="off"><input id="p" type="password" placeholder="Пароль">
<p class="err">${msg||''}</p><div class="row"><button id="in">Войти</button><button class="s" id="rg">Регистрация</button></div></div>`;
 $('#in').onclick=()=>login($('#l').value.trim().toLowerCase(),$('#p').value);
 $('#rg').onclick=reg}
async function reg(){const l=$('#l').value.trim().toLowerCase(),p=$('#p').value;
 if(!/^[a-z0-9_]{3,16}$/.test(l)||p.length<4||l===ADM)return authView('Логин 3–16 символов (a-z, 0-9, _), пароль от 4');
 if((await ud(l).get()).exists)return authView('Такой логин занят');
 await ud(l).set({pw:await H(l+':'+p),bal:500,loan:0,due:0,blocked:false,approved:false,ts:Date.now()});
 authView('✅ Заявка отправлена. Дождись подтверждения админа, потом войди.')}
async function login(l,p,auto){
 const h=await H(l+':'+p);let s=await ud(l).get();
 if(l===ADM){if(h!==(s.exists?s.data().pw:AH))return authView('Неверный логин или пароль');
  if(!s.exists)await ud(l).set({pw:h,bal:0,loan:0,due:0,blocked:false,ts:Date.now(),admin:true})}
 else if(!s.exists||s.data().pw!==h){LS.s(null);return authView('Неверный логин или пароль')}
 if(l!==ADM&&s.data().approved===false){LS.s(null);return authView('Аккаунт ждёт подтверждения админа')}
 me=l;LS.s({l,p});tab='games';if(l===ADM)db.collection('users').onSnapshot(q=>{pend=q.docs.filter(d=>d.data().approved===false).length;const b=$('#pb');if(b)b.textContent=pend||''});
 unU=ud(l).onSnapshot(x=>{if(!x.exists){LS.s(null);unU&&unU();me=U=null;return authView('Аккаунт удалён')}U=x.data();checkDue();if(!stop||tab!=='play')render()});}
async function checkDue(){if(U&&U.loan>0&&!U.blocked&&Date.now()>U.due){U.blocked=true;
 await ud(me).update({blocked:true});await db.doc('alerts/'+me).set({login:me,amt:U.loan,ts:Date.now()})}}
const NAV=[['games','🎮','Игры'],['top','🏆','Топ'],['chat','💬','Чат'],['profile','👤','Профиль']];
function shell(inner){const nv=(me===ADM?NAV.filter(n=>n[0]!='profile'):NAV).concat(me===ADM?[['admin','🛠','Админ']]:[]);
 A.innerHTML=`<header><div class="av">${me[0].toUpperCase()}</div><div><b>${me}</b><div class="m">Игровой клуб</div></div><div class="bal">💰 ${U.bal}</div></header><main id="v">${inner}</main><nav>${nv.map(n=>`<button data-t="${n[0]}" class="${tab==n[0]||(tab=='play'&&n[0]=='games')?'on':''}"><i>${n[1]}</i>${n[2]}${n[0]=='admin'?`<em id="pb" class="bdg">${pend||''}</em>`:''}</button>`).join('')}</nav>`;
 A.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{cleanup();tab=b.dataset.t;render()})}
const GAMES=[['Крестики-нолики','❌','Онлайн · ставки','#ff6cc3','#7c6cff',ttt],['Шашки','⚫','Онлайн · ставки','#ffb86c','#ff5d73',checkers],['Дурак','🃏','Онлайн · 2–8 игроков','#f7971e','#ffd200',durak],['2048','🔢','Одиночная','#2ee59d','#0fa3b1',g2048],['Змейка','🐍','Одиночная','#7cf29a','#1fb26b',snake],['Блок Бласт','🧱','Одиночная','#6cc4ff','#7c6cff',blast],['Кликер','👆','10 секунд','#ffd166','#ff8a5c',clicker],['Викторина','❓','Для всех','#c471f5','#fa71cd',quiz]];
function render(){if(!U)return;cleanup();
 if(tab=='profile')return profile();if(tab=='admin')return admin();if(tab=='top')return leaders();if(tab=='chat')return chat(window.cp);if(tab=='play')return;
 shell(`<div id="ann"></div><h2>Выбери игру</h2><div class="grid">${GAMES.map((g,i)=>`<div class="gc" data-i="${i}" style="background:linear-gradient(135deg,${g[3]},${g[4]})"><b>${g[1]}</b><span>${g[0]}</span><small>${g[2]}</small></div>`).join('')}</div>`);
 stop=db.doc('meta/ann').onSnapshot(x=>{const e=$('#ann');if(e)e.innerHTML=x.exists&&x.data().t?`<div class="card" style="border-color:#ffd16666">📢 ${esc(x.data().t)}</div>`:''});
 A.querySelectorAll('[data-i]').forEach(c=>c.onclick=()=>{cleanup();tab='play';shell('<button class="s" id="bk" style="margin-bottom:6px">← Назад</button><div id="g"></div>');$('#bk').onclick=()=>{cleanup();tab='games';render()};GAMES[c.dataset.i][5]($('#g'))})}
function profile(){const left=U.loan?Math.max(0,U.due-Date.now()):0,hrs=Math.ceil(left/36e5);
 shell(`<div class="card"><h3>Баланс: ${U.bal} 💰</h3>${U.loan?`<p>Долг: <b>${U.loan}</b>. Осталось ~${hrs} ч.</p><button class="g" id="rp">Вернуть кредит</button>`:
 U.blocked?'<p class="err">Кредит заблокирован. Админ уведомлён.</p>':`<p class="m">Кредит до 1000 монет на 1 день. Не вернёшь — больше не дадим.</p><input id="la" type="number" min="1" max="1000" placeholder="Сколько взять (1–1000)"><button id="ln" style="width:100%;margin-top:6px">Взять кредит</button>`}
 ${U.loan&&U.blocked?'<p class="err">Срок вышел, админ уведомлён.</p>':''}<p class="err">${note}</p></div><div class="card"><h3>💸 Перевод игроку</h3><input id="tl" placeholder="Ник игрока" autocapitalize="off"><input id="ta" type="number" placeholder="Сумма"><button id="tx" class="g" style="width:100%;margin-top:6px">Отправить</button></div><button class="s" id="lo">Выйти</button>`);
 const ln=$('#ln');if(ln)ln.onclick=()=>{const a=+$('#la').value|0;if(a<1||a>1000){note='Сумма от 1 до 1000';return render()}note='';ud(me).update({bal:U.bal+a,loan:a,due:Date.now()+864e5})};
 const rp=$('#rp');if(rp)rp.onclick=async()=>{if(U.bal<U.loan){note='Не хватает монет';return render()}note='';await ud(me).update({bal:U.bal-U.loan,loan:0,due:0,blocked:false});await db.doc('alerts/'+me).delete().catch(()=>{})};
 $('#tx').onclick=async()=>{const l=$('#tl').value.trim().toLowerCase(),a=+$('#ta').value|0;if(!l||l===me||a<1||a>U.bal||!(await ud(l).get()).exists){note='Проверь ник и сумму';return render()}await ud(l).update({bal:firebase.firestore.FieldValue.increment(a)});await ud(me).update({bal:U.bal-a});note='Отправлено '+a+' → '+l;render()};
 $('#lo').onclick=()=>{LS.s(null);unU&&unU();me=U=null;authView()}}
function admin(){window._al=[];window._d=null;shell('<p class="m">Загрузка…</p>');let u1=db.collection('users').onSnapshot(us=>{const draw=()=>{if(tab!=='admin')return;const al=window._al||[];
 const L=us.docs.filter(d=>d.id!==ADM),PN=L.filter(d=>d.data().approved===false);$('#v').innerHTML=`<div class="card"><h3>Зарегистрировано: ${L.length-PN.length}</h3>
<div class="row"><input id="am" type="number" placeholder="Сумма"><button class="g" id="tp">Пополнить баланс</button><button class="r" id="zr">Обнулить мой баланс</button></div></div>
<div class="card"><h3>🔔 Должники (${al.length})</h3>${al.map(a=>`<p><b>${a.login}</b> не вернул ${a.amt}<br><button data-u="${a.login}">Разблокировать</button> <button class="r" data-k="${a.login}">Оставить</button></p>`).join('')||'<p class="m">Нет</p>'}</div>
<div class="card"><h3>🆕 Заявки на регистрацию (${PN.length})</h3>${PN.map(d=>`<div class="row" style="margin:6px 0"><b>${d.id}</b><button class="g" data-ok="${d.id}">Принять</button><button class="r" data-no="${d.id}">Отклонить</button></div>`).join('')||'<p class="m">Новых заявок нет</p>'}</div><div class="card"><h3>📢 Объявление на главной</h3><input id="an" placeholder="Текст объявления"><div class="row"><button id="ap">Опубликовать</button><button class="s" id="ac">Убрать</button></div></div><div class="card"><h3>🔑 Сменить пароль</h3><input id="pl" placeholder="Логин (свой или участника)"><input id="pp" placeholder="Новый пароль"><button id="pw">Сменить</button></div><div class="card"><table><tr><th>Логин</th><th>Баланс</th><th>Долг</th></tr>${L.map(d=>{const x=d.data();return`<tr><td>${d.id}${x.blocked?' 🚫':''}</td><td>${x.bal}</td><td>${x.loan}</td></tr>`}).join('')}</table></div>`;
 $('#tp').onclick=()=>{const n=+$('#am').value;if(n>0)addBal(n)};
 $('#ap').onclick=()=>{const t=$('#an').value.trim();if(t)db.doc('meta/ann').set({t,ts:Date.now()})};$('#ac').onclick=()=>db.doc('meta/ann').set({t:'',ts:Date.now()});
 A.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>ud(b.dataset.ok).update({approved:true}));A.querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>ud(b.dataset.no).delete());
 $('#zr').onclick=()=>{const z=$('#zr');if(z.dataset.k)ud(me).update({bal:0});else{z.dataset.k=1;z.textContent='Точно? Нажми ещё раз'}};
 $('#pw').onclick=async()=>{const l=$('#pl').value.trim().toLowerCase(),p=$('#pp').value;if(p.length<4||!(await ud(l).get()).exists){$('#pw').textContent='Ошибка: логин или пароль';return}await ud(l).update({pw:await H(l+':'+p)});if(l===ADM)LS.s({l,p});$('#pw').textContent='Готово ✓'};
 A.querySelectorAll('[data-u]').forEach(b=>b.onclick=async()=>{await ud(b.dataset.u).update({blocked:false,due:Date.now()+864e5});db.doc('alerts/'+b.dataset.u).delete()});
 A.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>db.doc('alerts/'+b.dataset.k).delete())};
 stop=()=>{u1();u2()};window._d=draw;draw()});

   $('#lv').onclick=async()=>{if(r.host!=me&&r.p.includes(me)){await addBal(r.bet);await db.doc('rd/'+c).update({p:r.p.filter(x=>x!=me)})}else if(r.host==me&&r.p.length==1){await addBal(r.bet);await db.doc('rd/'+c).delete()}lobby()};return}
  const t=r.table||[],att=r.p[r.at],def=r.p[r.df],hand=[...(r.hands[me]||[])].sort((a,b)=>a-b),isDef=me==def,und=t.filter(x=>x.d<0).length,alive=!r.out.includes(me),n=r.p.length;
  let st=r.st=='end'?(r.loser?`🃏 Дурак: <b>${r.loser}</b>`+(r.loser==me?'. Ты проиграл ставку':'. Ты выиграл +'+Math.floor(r.bet/(n-1))):'Ничья, ставки возвращены'):!alive?'Ты вышел из игры 🎉 ждёшь итогов':r.tk?(isDef?'Ты берёшь, соперники подкидывают…':'Защитник берёт: подкидывай или жми «Готово»'):isDef?(und?'Ты отбиваешься: тапни карту (или «Беру»)':'Все отбито, ждём «Бито»'):me==att&&!t.length?'Твой ход: атакуй любой картой':und?'Защитник отбивается, можно подкинуть':t.length?'Подкидывай той же масти значения или жми «Бито»':'Ждём атаку';
  el.innerHTML=`<div class="dfs"><div class="dtop"><button class="s" id="lv">✕</button><span>Банк ${r.bet*n} 💰</span><span>Козырь ${SU[r.trump]} · 🂠 ${r.deck.length}</span></div>
  <div class="opp">${r.p.filter(x=>x!=me).map(x=>`<div class="op ${r.st=='play'&&x==att?'at':''} ${r.st=='play'&&x==def?'df':''}"><div class="av2">${x[0].toUpperCase()}</div><b>${x}</b><small>${r.out.includes(x)?'вышел':'🂠 '+(r.hands[x]||[]).length}</small></div>`).join('')}</div>
  <div class="felt"><div class="tbl2">${t.map((x,i)=>`<div class="pr ${selT==i?'sel2':''}" data-t="${i}">${card(x.a)}${x.d>=0?card(x.d):''}</div>`).join('')||'<span style="color:#ffffff88">Стол пуст</span>'}</div></div>
  <p class="st">${st}</p>
  <div class="acts">${r.st=='play'&&alive?`${isDef&&und&&!r.tk?'<button id="tk" class="r">Беру</button>':''}${!isDef&&t.length&&r.tk?'<button id="bt3" class="g">Готово, пусть берёт</button>':''}${!isDef&&t.length&&!und&&!r.tk?'<button id="bt2" class="g">Бито</button>':''}`:''}</div>
  <div class="hand2">${alive&&r.st=='play'?hand.map(k=>card(k,`data-h="${k}"`)).join(''):''}</div></div>`;
  el.querySelectorAll('[data-t]').forEach(d=>d.onclick=()=>{selT=+d.dataset.t;draw(c,r)});
  el.querySelectorAll('[data-h]').forEach(d=>d.onclick=()=>play(c,r,+d.dataset.h));
  const tk=$('#tk'),b2=$('#bt2');if(tk)tk.onclick=()=>take(c,r);if(b2)b2.onclick=()=>bito(c,r);const b3=$('#bt3');if(b3)b3.onclick=()=>takeFin(c,r);
  $('#lv').onclick=()=>lobby();
  if(r.st=='end'&&!paid&&!r['pd_'+me]&&r.p.includes(me)){paid=true;const a=!r.loser?r.bet:r.loser==me?0:r.bet+Math.floor(r.bet/(n-1));if(a)addBal(a);db.doc('rd/'+c).update({['pd_'+me]:true})}}
 lobby()}
function g2048(el){let b=Array(16).fill(0),sc=0;
 const add=()=>{const e=b.map((v,i)=>v?-1:i).filter(i=>i>=0);if(e.length)b[e[Math.random()*e.length|0]]=Math.random()<.9?2:4};add();add();
 function mv(d){let mo=false;for(let i=0;i<4;i++){const ix=j=>d<2?i*4+j:j*4+i;let l=[0,1,2,3].map(j=>b[ix(j)]);if(d%2)l.reverse();let n=l.filter(x=>x);
  for(let k=0;k<n.length-1;k++)if(n[k]==n[k+1]){n[k]*=2;sc+=n[k];n.splice(k+1,1)}while(n.length<4)n.push(0);if(d%2)n.reverse();
  for(let j=0;j<4;j++)if(b[ix(j)]!=n[j]){mo=true;b[ix(j)]=n[j]}}if(mo)add();rec('2048',sc);draw()}
 function draw(){el.innerHTML=`<div class="card"><div class="top"><b>2048</b><span>Очки: ${sc} · рекорд ${(U.rec||{})['2048']||0}</span></div><div class="b4" id="bd">${b.map(v=>`<div class="t" style="${v?`background:hsl(${260-Math.log2(v)*22},80%,58%);color:#fff`:''}">${v||''}</div>`).join('')}</div>
 <div class="row" style="margin-top:8px"><button class="s" data-d="2">⬆</button><button class="s" data-d="3">⬇</button><button class="s" data-d="0">⬅</button><button class="s" data-d="1">➡</button></div>
 <button class="g" id="cl" style="margin-top:8px;width:100%">Начать заново</button></div>`;
 el.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>mv(+x.dataset.d));
 $('#cl').onclick=()=>{b=Array(16).fill(0);sc=0;add();add();draw()};
 let sx,sy;const bd=$('#bd');bd.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};
 bd.ontouchend=e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;mv(Math.abs(dx)>Math.abs(dy)?(dx>0?1:0):(dy>0?3:2))}}
 const k=e=>{const m={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3}[e.key];if(m!=null){e.preventDefault();mv(m)}};
 document.addEventListener('keydown',k);stop=()=>document.removeEventListener('keydown',k);draw()}
function snake(el){const N=15;let s=[[7,7]],d=[1,0],f=[3,3],sc=0,run=false,iv;
 el.innerHTML=`<div class="card"><div class="top"><b>Змейка</b><span id="sc">0</span></div><canvas id="c" width="300" height="300"></canvas>
 <div class="dp"><span></span><button class="s" data-v="0,-1">⬆</button><span></span><button class="s" data-v="-1,0">⬅</button><button class="s" data-v="0,1">⬇</button><button class="s" data-v="1,0">➡</button></div>
 <button id="go" style="margin-top:8px;width:100%">Старт</button></div>`;
 const cx=$('#c').getContext('2d');let sx,sy;const cv=$('#c');cv.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};cv.ontouchend=e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>20)set(Math.abs(dx)>Math.abs(dy)?[dx>0?1:-1,0]:[0,dy>0?1:-1])};
 const set=v=>{if(v[0]!==-d[0]||v[1]!==-d[1])d=v};
 el.querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>set(x.dataset.v.split(',').map(Number)));
 const k=e=>{const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(m){e.preventDefault();set(m)}};
 document.addEventListener('keydown',k);
 const draw=()=>{cx.clearRect(0,0,300,300);cx.fillStyle='#e5484d';cx.fillRect(f[0]*20,f[1]*20,18,18);cx.fillStyle='#1fb26b';s.forEach(p=>cx.fillRect(p[0]*20,p[1]*20,18,18))};
 function tick(){const h=[s[0][0]+d[0],s[0][1]+d[1]];
  if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||s.some(p=>p[0]==h[0]&&p[1]==h[1])){clearInterval(iv);run=false;rec('Змейка',sc);$('#go').textContent='Игра окончена: '+sc+'. Ещё раз';s=[[7,7]];d=[1,0];sc=0;return}
  s.unshift(h);if(h[0]==f[0]&&h[1]==f[1]){sc++;$('#sc').textContent=sc;f=[Math.random()*N|0,Math.random()*N|0]}else s.pop();draw()}
 $('#go').onclick=()=>{if(run)return;run=true;sc=0;$('#sc').textContent=0;iv=setInterval(tick,230)};
 stop=()=>{clearInterval(iv);document.removeEventListener('keydown',k)};draw()}
function clicker(el){let n=0,t=0,run=false,iv;
 el.innerHTML=`<div class="card" style="text-align:center"><h3>👆 Кликер: 10 секунд</h3><div id="cn" style="font-size:60px;font-weight:800">0</div><div class="m" id="cx2">Нажми кнопку, чтобы начать</div><div class="m">Рекорд: <b>${(U.rec||{})['Кликер']||0}</b></div><button id="ck" style="font-size:56px;padding:34px 60px;margin-top:14px;touch-action:manipulation">👆</button></div>`;
 const cn=$('#cn'),ci=$('#cx2');
 $('#ck').onpointerdown=()=>{if(!run){n=0;run=true;t=10;iv=setInterval(()=>{t-=.1;if(t<=0){clearInterval(iv);run=false;ci.textContent='Время вышло: '+n+' кликов! Жми, чтобы заново';rec('Кликер',n);return}ci.textContent='Осталось '+t.toFixed(1)+' с'},100)}n++;cn.textContent=n};
 stop=()=>clearInterval(iv)}
function ttt(el){const W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let u1,u2,msg='';
 stop=()=>{u1&&u1();u2&&u2()};
 function lobby(){stop();el.innerHTML=`<div class="card"><h3>❌⭕ Онлайн</h3><input id="bt" type="number" value="100" min="100" placeholder="Ставка"><button id="cr" style="width:100%">Создать комнату</button><p class="err">${msg}</p></div><div class="card"><h4>Открытые комнаты</h4><div id="ls" class="m">…</div></div>`;
  $('#cr').onclick=async()=>{const bet=+$('#bt').value|0;if(bet<100||bet>U.bal){msg='Ставка от 100 и не больше баланса';return lobby()}msg='';const c=String(Math.random()*9000+1000|0);
   await addBal(-bet);await db.doc('rooms/'+c).set({x:me,o:'',bet,board:'---------',turn:'x',win:'',px:false,po:false,ts:Date.now()});room(c)};
  u1=db.collection('rooms').onSnapshot(s=>{const L=s.docs.filter(d=>{const x=d.data();return !x.o&&x.x!==me&&!x.win&&Date.now()-x.ts<36e5});
   $('#ls').innerHTML=L.map(d=>{const x=d.data();return`<p>${x.x} · ставка ${x.bet} <button data-j="${d.id}">Играть</button></p>`}).join('')||'Нет, создай свою и позови друга';
   el.querySelectorAll('[data-j]').forEach(b=>b.onclick=async()=>{const r=(await db.doc('rooms/'+b.dataset.j).get()).data();if(!r||r.o||U.bal<r.bet){msg='Недоступно';return lobby()}
    await addBal(-r.bet);await db.doc('rooms/'+b.dataset.j).update({o:me});room(b.dataset.j)})})}
 function room(c){stop();let paid=false;u2=db.doc('rooms/'+c).onSnapshot(s=>{if(!s.exists)return lobby();const r=s.data(),mk=r.x==me?'x':'o';
  const myT=r.turn==mk&&r.o&&!r.win;
  el.innerHTML=`<div class="card"><div class="top"><b>Комната ${c}</b><span>Банк: ${r.bet*2} 💰</span></div><p>${r.x} ❌ vs ${r.o||'ждём соперника…'} ⭕</p>
  <div class="b3">${[...r.board].map((v,i)=>`<div data-c="${i}">${v=='-'?'':v=='x'?'❌':'⭕'}</div>`).join('')}</div>
  <p style="text-align:center"><b>${r.win?(r.win=='d'?'Ничья, ставки возвращены':(r.win==mk?'🏆 Ты выиграл '+r.bet*2:'Ты проиграл')):!r.o?'':myT?'Твой ход':'Ход соперника'}</b></p>
  <div class="row"><button class="s" id="lv">${!r.o?'Отменить':'Выйти'}</button></div></div>`;
  $('#lv').onclick=async()=>{if(!r.o&&!r.win){await addBal(r.bet);await db.doc('rooms/'+c).delete()}lobby()};
  el.querySelectorAll('[data-c]').forEach(d=>d.onclick=()=>{const i=+d.dataset.c;if(!myT||r.board[i]!='-')return;
   const bd=[...r.board];bd[i]=mk;const w=W.some(l=>l.every(k=>bd[k]==mk))?mk:bd.includes('-')?'':'d';
   db.doc('rooms/'+c).update({board:bd.join(''),turn:mk=='x'?'o':'x',win:w})});
  if(r.win&&!paid&&!r['p'+mk]&&(r.win=='d'||r.win==mk)){paid=true;const n=r.win=='d'?r.bet:r.bet*2;addBal(n);db.doc('rooms/'+c).update({['p'+mk]:true})}})}
 lobby()}
